name: Deploy to Cloudflare Pages

on:
  push:
    branches: [ main ]

jobs:
  deploy-to-cloudflare-pages:
    runs-on: ubuntu-latest
    steps:
    # Obtém o código do repositório
    - uses: actions/checkout@v4

    # Configura o .NET SDK
    - name: Setup .NET Core SDK
      uses: actions/setup-dotnet@v4
      with:
        dotnet-version: 10.0.301

    # Gera o appsettings.Production.json a partir dos GitHub Secrets
    - name: Generate appsettings.Production.json
      env: 
        EMAILJS_PUBLIC_KEY: ${{ secrets.EMAILJS_PUBLIC_KEY }}
        EMAILJS_SERVICE_ID: ${{ secrets.EMAILJS_SERVICE_ID }}
        EMAILJS_TEMPLATE_ID: ${{ secrets.EMAILJS_TEMPLATE_ID }}
        VERIFALIA_API_KEY: ${{ secrets.VERIFALIA_API_KEY }}
      run: |
        cat > src/HcDentalClinic/wwwroot/appsettings.Production.json << EOF
        {
          "EmailJS": {
            "PublicKey": "$EMAILJS_PUBLIC_KEY",
            "ServiceID": "$EMAILJS_SERVICE_ID",
            "TemplateID": "$EMAILJS_TEMPLATE_ID"
          },
          "Verifalia": {
            "ApiKey": "$VERIFALIA_API_KEY"
          }
        }
        EOF

    # Compila o projeto Blazor WASM
    - name: Publish .NET Core project
      run: dotnet publish -c Release -o release --nologo

    # Adiciona o ficheiro de redirecionamento para SPAs no Cloudflare
    - name: Add SPA _redirects file
      run: echo "/*  /index.html  200" > release/wwwroot/_redirects

    # Publica os ficheiros estáticos diretamente no Cloudflare Pages
    - name: Deploy to Cloudflare Pages
      uses: cloudflare/pages-action@v1
      with:
        apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        projectName: 'hc-dental-clinic'
        directory: 'release/wwwroot'
        gitBranch: 'main'